<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18211e"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="My Money">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>My Money</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#18211e;--muted:#718078;--line:#e1e6e2;--g:#2f7053;--gb:#e5f0e9;--a:#b47820;--ab:#fbefd9;--r:#aa4438;--rb:#f8e2df}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
#app{max-width:560px;margin:auto;min-height:100dvh;padding-bottom:92px}.top{padding:calc(14px + env(safe-area-inset-top)) 18px 8px;display:flex;justify-content:space-between}.brand{font-size:22px;font-weight:750}.month{font-size:13px;color:var(--muted)}.content{padding:8px 16px 24px}
.hero{background:var(--ink);color:#fff;border-radius:23px;padding:20px;margin-bottom:13px}.label{opacity:.7;font-size:13px}.amount{font-size:34px;font-weight:750;margin:4px 0 12px}.sub{font-size:13px;opacity:.75}.progress{height:8px;background:#ffffff25;border-radius:8px;margin-top:13px;overflow:hidden}.progress i{display:block;height:100%;background:#8fc4a6}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border:1px solid var(--line);border-radius:17px;background:#fff}.k{font-size:12px;color:var(--muted)}.v{font-size:19px;font-weight:700;margin-top:4px}
.sh{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px}.sh h2{font-size:16px;margin:0}.link{background:none;color:var(--g);font-size:13px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick button{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px 5px;font-weight:650;font-size:12px}.ico{display:block;font-size:21px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.dot{width:9px;height:9px;border-radius:50%;background:var(--g)}.rm{flex:1;min-width:0}.rt{font-size:14px;font-weight:650}.rs{font-size:11.5px;color:var(--muted);margin-top:3px}.money{text-align:right;font-size:14px;font-weight:700}.danger{color:var(--r)}.warn{color:var(--a)}.empty{text-align:center;color:var(--muted);font-size:13px;padding:18px}
.nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:#fffffff2;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
.nav button{background:none;color:#7a857f;font-size:10px;font-weight:650;padding:5px}.nav button.active{color:var(--g)}.ni{display:block;font-size:20px;line-height:22px}
.fab{position:fixed;z-index:11;right:max(18px,calc((100vw - 560px)/2 + 18px));bottom:92px;width:58px;height:58px;border-radius:20px;background:var(--g);color:#fff;font-size:30px;box-shadow:0 8px 22px #2f70534d}
.back{position:fixed;inset:0;background:#0006;z-index:30;display:flex;align-items:flex-end}.sheet{width:min(560px,100%);margin:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:17px 16px calc(20px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}.sheet h3{margin:3px 0 14px;font-size:19px}
.field{margin:9px 0}.field label{display:block;font-size:11px;color:var(--muted);margin:0 0 5px 3px}.field input,.field select{width:100%;height:47px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:0 12px}
.primary{width:100%;height:48px;border-radius:14px;background:var(--g);color:#fff;font-weight:700;margin-top:8px}.secondary{width:100%;height:44px;background:none;color:var(--muted);font-weight:600}.bar{height:9px;background:#edf0ed;border-radius:9px;overflow:hidden;margin:9px 0 5px}.bar i{display:block;height:100%;background:var(--g)}.bar i.w{background:var(--a)}.bar i.d{background:var(--r)}
.chart{height:155px;display:flex;align-items:flex-end;gap:9px;padding:12px 2px 5px}.bw{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center}.b{width:24px;background:var(--g);border-radius:7px 7px 3px 3px;min-height:4px}.bl{font-size:9px;color:var(--muted);text-align:center;margin-top:4px}
</style></head><body><div id="app"></div><script>
const K='my-money-v2',uid=()=>Math.random().toString(36).slice(2,10),today=()=>new Date().toISOString().slice(0,10);
const mk=d=>{let x=new Date(d||Date.now());return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')};
const M=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Math.round(n||0));
const F=d=>new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
const D=d=>Math.round((new Date(d)-new Date(new Date().setHours(0,0,0,0)))/86400000);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function plus(n){let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function seed(){let b=uid();return{income:75000,payday:1,cats:[{id:uid(),n:'Groceries',b:15000,t:80},{id:uid(),n:'Dining',b:5000,t:75},{id:b,n:'Bills',b:22000,t:90}],ex:[],bills:[{id:uid(),n:'Electricity',a:2200,d:plus(2),r:'monthly',c:b},{id:uid(),n:'Internet',a:999,d:plus(5),r:'monthly',c:b},{id:uid(),n:'Rent',a:18000,d:plus(12),r:'monthly',c:b}]}}
let data=JSON.parse(localStorage.getItem(K)||'null')||seed(),tab='home',modal=null;
const save=()=>{localStorage.setItem(K,JSON.stringify(data));render()},cat=id=>data.cats.find(c=>c.id===id),spent=id=>data.ex.filter(e=>e.c===id&&mk(e.d)===mk()).reduce((a,e)=>a+e.a,0),total=()=>data.ex.filter(e=>mk(e.d)===mk()).reduce((a,e)=>a+e.a,0);
function bill(b){let n=D(b.d),cl=n<0?'danger':n<=7?'warn':'';return '<div class="row"><div class="dot" style="background:'+(n<0?'var(--r)':n<=7?'var(--a)':'var(--g)')+'"></div><div class="rm"><div class="rt">'+esc(b.n)+'</div><div class="rs">'+F(b.d)+' · '+b.r+'</div></div><div class="money">'+M(b.a)+'<div class="'+cl+'" style="font-size:10px;margin-top:3px">'+(n<0?Math.abs(n)+'d overdue':n===0?'Due today':n===1?'Tomorrow':'Due in '+n+'d')+'</div></div></div>'}
function alerts(){let a=[];data.bills.forEach(b=>{let n=D(b.d);if(n<0)a.push('<span class="danger">⚠️ '+esc(b.n)+' is overdue</span>');else if(n<=7)a.push('<span class="warn">⏰ '+esc(b.n)+' due '+(n?'in '+n+' days':'today')+'</span>')});data.cats.forEach(c=>{let p=c.b?spent(c.id)/c.b*100:0;if(p>=100)a.push('<span class="danger">⚠️ '+esc(c.n)+' is over budget</span>');else if(p>=c.t)a.push('<span class="warn">Budget alert: '+esc(c.n)+' at '+Math.round(p)+'%</span>')});return a}
function home(){let s=total(),r=data.income-s,p=data.income?s/data.income*100:0,bs=[...data.bills].sort((a,b)=>new Date(a.d)-new Date(b.d)).slice(0,3);return '<div class="hero"><div class="label">Available this month</div><div class="amount">'+M(r)+'</div><div class="sub">Income '+M(data.income)+' · Spent '+M(s)+'</div><div class="progress"><i style="width:'+Math.min(p,100)+'%"></i></div></div><div class="grid"><div class="stat"><div class="k">Monthly income</div><div class="v">'+M(data.income)+'</div></div><div class="stat"><div class="k">Spent</div><div class="v">'+M(s)+'</div></div></div><div class="sh"><h2>Quick add</h2></div><div class="quick"><button onclick="openM('expense')"><span class="ico">💸</span>Expense</button><button onclick="openM('bill')"><span class="ico">📅</span>Bill</button><button onclick="openM('settings')"><span class="ico">💰</span>Income</button></div><div class="sh"><h2>Alerts</h2></div><div class="card">'+(alerts().length?alerts().map(x=>'<div style="padding:7px 0;font-size:13px">'+x+'</div>').join(''):'<div class="empty">Everything looks good.</div>')+'</div><div class="sh"><h2>Upcoming bills</h2><button class="link" onclick="tab='bills';render()">See all</button></div><div class="card">'+(bs.map(bill).join('')||'<div class="empty">No bills yet.</div>')+'</div>'}
function expenses(){let ex=data.ex.filter(e=>mk(e.d)===mk()).sort((a,b)=>new Date(b.d)-new Date(a.d));return '<div class="card"><div class="k">This month</div><div style="font-size:29px;font-weight:750;margin-top:4px">'+M(total())+'</div><div class="k">'+ex.length+' transactions</div></div><div class="sh"><h2>Transactions</h2></div><div class="card">'+(ex.length?ex.map(e=>'<div class="row"><div class="dot"></div><div class="rm"><div class="rt">'+esc(e.x||'Expense')+'</div><div class="rs">'+esc(cat(e.c)?.n||'Other')+' · '+F(e.d)+'</div></div><div class="money">−'+M(e.a)+'<button onclick="delEx(\''+e.id+'\')" style="display:block;background:none;color:var(--r);font-size:10px;margin-left:auto">Delete</button></div></div>').join(''):'<div class="empty">No expenses this month.</div>')+'</div>'}
function bills(){let bs=[...data.bills].sort((a,b)=>new Date(a.d)-new Date(b.d));return '<div class="sh"><h2>All bills</h2><button class="link" onclick="openM(\'bill\')">+ Add</button></div><div class="card">'+(bs.length?bs.map(b=>bill(b)+'<div style="display:flex;gap:7px;padding:0 0 11px 20px"><button class="primary" style="height:35px;width:auto;padding:0 12px;margin:0;font-size:11px" onclick="paid(\''+b.id+'\')">Mark paid</button><button class="secondary" style="height:35px;width:auto;padding:0 12px;margin:0;border:1px solid var(--line);border-radius:10px" onclick="delBill(\''+b.id+'\')">Remove</button></div>').join(''):'<div class="empty">No bills added.</div>')+'</div>'}
function budget(){return '<div class="card"><div class="k">Budget used</div><div style="font-size:29px;font-weight:750;margin-top:4px">'+M(total())+'</div></div><div class="sh"><h2>Categories</h2><button class="link" onclick="openM(\'cat\')">+ Add</button></div>'+data.cats.map(c=>{let s=spent(c.id),p=c.b?s/c.b*100:0,cl=p>=100?'d':p>=c.t?'w':'';return '<div class="card"><div style="display:flex;justify-content:space-between"><div><b>'+esc(c.n)+'</b><div class="k">Alert at '+c.t+'%</div></div><div style="text-align:right"><b>'+M(s)+'</b><div class="k">of '+M(c.b)+'</div></div></div><div class="bar"><i class="'+cl+'" style="width:'+Math.min(p,100)+'%"></i></div><div style="display:flex;justify-content:space-between;font-size:11px"><span>'+Math.round(p)+'% used</span><span>'+ (s<=c.b?M(c.b-s)+' left':M(s-c.b)+' over')+'</span></div></div>'}).join('')}
function reports(){let v=[];for(let i=5;i>=0;i--){let d=new Date();d.setMonth(d.getMonth()-i),k=mk(d),n=data.ex.filter(e=>mk(e.d)===k).reduce((a,e)=>a+e.a,0);v.push({n,l:d.toLocaleDateString('en-IN',{month:'short'})})}let mx=Math.max(...v.map(x=>x.n),1);return '<div class="card"><b>Spending trend</b><div class="k">Last 6 months</div><div class="chart">'+v.map(x=>'<div class="bw"><div><div class="b" style="height:'+Math.max(5,x.n/mx*115)+'px"></div><div class="bl">'+x.l+'</div></div></div>').join('')+'</div></div><div class="card"><b>This month</b>'+data.cats.map(c=>'<div class="row"><div class="rm"><div class="rt">'+esc(c.n)+'</div></div><div class="money">'+M(spent(c.id))+'</div></div>').join('')+'</div><div class="card"><b>Settings</b><button onclick="openM(\'settings\')" style="display:block;width:100%;text-align:left;background:none;padding:14px 0">Monthly income <span style="float:right">'+M(data.income)+'</span></button><button onclick="openM(\'settings\')" style="display:block;width:100%;text-align:left;background:none;padding:14px 0">Payday <span style="float:right">Day '+data.payday+'</span></button></div>'}
function modalView(){if(!modal)return '';if(modal==='expense')return '<div class="back" onclick="closeM(event)"><div class="sheet" onclick="event.stopPropagation()"><h3>Add expense</h3><div class="field"><label>AMOUNT</label><input id="a" type="number" inputmode="decimal" placeholder="₹ 0"></div><div class="field"><label>DESCRIPTION</label><input id="x" placeholder="What did you spend on?"></div><div class="field"><label>CATEGORY</label><select id="c">'+data.cats.map(c=>'<option value="'+c.id+'">'+esc(c.n)+'</option>').join('')+'</select></div><div class="field"><label>DATE</label><input id="d" type="date" value="'+today()+'"></div><button class="primary" onclick="addEx()">Save expense</button><button class="secondary" onclick="modal=null;render()">Cancel</button></div></div>';if(modal==='bill')return '<div class="back" onclick="closeM(event)"><div class="sheet" onclick="event.stopPropagation()"><h3>Add bill</h3><div class="field"><label>BILL NAME</label><input id="bn" placeholder="Electricity, rent, etc."></div><div class="field"><label>AMOUNT</label><input id="ba" type="number" inputmode="decimal" placeholder="₹ 0"></div><div class="field"><label>DUE DATE</label><input id="bd" type="date" value="'+today()+'"></div><div class="field"><label>REPEAT</label><select id="br"><option value="once">One-time</option><option value="weekly">Weekly</option><option value="monthly" selected>Monthly</option><option value="yearly">Yearly</option></select></div><div class="field"><label>CATEGORY</label><select id="bc">'+data.cats.map(c=>'<option value="'+c.id+'">'+esc(c.n)+'</option>').join('')+'</select></div><button class="primary" onclick="addBill()">Save bill</button><button class="secondary" onclick="modal=null;render()">Cancel</button></div></div>';if(modal==='cat')return '<div class="back" onclick="closeM(event)"><div class="sheet" onclick="event.stopPropagation()"><h3>New budget category</h3><div class="field"><label>CATEGORY</label><input id="cn" placeholder="Travel, shopping, etc."></div><div class="field"><label>MONTHLY BUDGET</label><input id="cb" type="number" placeholder="₹ 0"></div><div class="field"><label>ALERT AT %</label><input id="ct" type="number" value="80"></div><button class="primary" onclick="addCat()">Add category</button><button class="secondary" onclick="modal=null;render()">Cancel</button></div></div>';return '<div class="back" onclick="closeM(event)"><div class="sheet" onclick="event.stopPropagation()"><h3>Money settings</h3><div class="field"><label>MONTHLY INCOME</label><input id="si" type="number" value="'+data.income+'"></div><div class="field"><label>PAYDAY</label><input id="sp" type="number" min="1" max="31" value="'+data.payday+'"></div><button class="primary" onclick="settings()">Save settings</button><button class="secondary" onclick="modal=null;render()">Cancel</button></div></div>'}
function closeM(e){if(e.target.className==='back'){modal=null;render()}}function openM(x){modal=x;render()}
function addEx(){let a=+document.getElementById('a').value;if(!a)return alert('Enter amount');data.ex.push({id:uid(),a,x:document.getElementById('x').value,c:document.getElementById('c').value,d:document.getElementById('d').value});modal=null;save()}
function addBill(){let n=document.getElementById('bn').value,a=+document.getElementById('ba').value;if(!n||!a)return alert('Enter bill name and amount');data.bills.push({id:uid(),n,a,d:document.getElementById('bd').value,r:document.getElementById('br').value,c:document.getElementById('bc').value});modal=null;save()}
function addCat(){let n=document.getElementById('cn').value,b=+document.getElementById('cb').value;if(!n||!b)return alert('Enter category and budget');data.cats.push({id:uid(),n,b,t:Math.min(100,Math.max(1,+document.getElementById('ct').value||80))});modal=null;save()}
function settings(){data.income=+document.getElementById('si').value||0;data.payday=Math.min(31,Math.max(1,+document.getElementById('sp').value||1));modal=null;save()}
function delEx(id){data.ex=data.ex.filter(e=>e.id!==id);save()}function delBill(id){data.bills=data.bills.filter(b=>b.id!==id);save()}
function paid(id){let b=data.bills.find(x=>x.id===id);data.ex.push({id:uid(),a:b.a,x:b.n,c:b.c,d:today()});if(b.r==='once')delBill(id);else{let x=new Date(b.d);if(b.r==='weekly')x.setDate(x.getDate()+7);if(b.r==='monthly')x.setMonth(x.getMonth()+1);if(b.r==='yearly')x.setFullYear(x.getFullYear()+1);b.d=x.toISOString().slice(0,10);save()}}
function nav(){let ns=[['home','⌂','Home'],['expenses','↘','Expenses'],['bills','▣','Bills'],['budget','◒','Budget'],['reports','▥','Reports']];return '<div class="nav">'+ns.map(n=>'<button class="'+(tab===n[0]?'active':'')+'" onclick="tab=\''+n[0]+'\';render()"><span class="ni">'+n[1]+'</span>'+n[2]+'</button>').join('')+'</div>'}
function render(){let t={home:'My Money',expenses:'Expenses',bills:'Bills',budget:'Budget',reports:'Reports'}[tab],b=tab==='home'?home():tab==='expenses'?expenses():tab==='bills'?bills():tab==='budget'?budget():reports();document.getElementById('app').innerHTML='<div class="top"><div class="brand">'+t+'</div><div class="month">'+new Date().toLocaleDateString('en-IN',{month:'long',year:'numeric'})+'</div></div><main class="content">'+b+'</main>'+(tab!=='reports'?'<button class="fab" onclick="openM(\'expense\')">+</button>':'')+nav()+modalView()}
render();window.openM=openM;window.closeM=closeM;window.addEx=addEx;window.addBill=addBill;window.addCat=addCat;window.settings=settings;window.delEx=delEx;window.delBill=delBill;window.paid=paid;window.render=render;
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
